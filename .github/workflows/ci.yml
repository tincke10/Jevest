name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dist/ (the Action bundle) is generated by the Release workflow and
      # lives only on the release tags' commits, never on main or in a PR.
      # Nobody edits or commits it by hand (docs/RELEASING.md).
      - name: No committed dist/
        run: |
          if [ -n "$(git ls-files dist)" ]; then
            echo "::error::dist/ is generated by the Release workflow only; remove it from this change (git rm -r --cached dist)."
            git ls-files dist
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

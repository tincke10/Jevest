name: Jevest self-review

# Dogfooding: this repo reviews its own PRs with the Action it publishes.
#
# SECURITY: deliberately `pull_request`, never `pull_request_target`. A
# pull_request_target run gets secrets even for a fork's PR, while running
# code checked out from that same untrusted fork — see docs/ACTION.md
# "Security notes". `pull_request` from a fork gets no secrets at all, so a
# fork PR here simply runs without the API keys (the job below fails
# closed instead of ever seeing a secret it shouldn't).
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write
  # Read-only: lets fetchPullRequest read the combined commit status for the
  # merge gate's CI signal. Without it, GitHub returns 403 and Jevest
  # degrades to reporting CI status as "unknown" rather than failing the run.
  statuses: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # Required here because `uses: ./` needs this repo's own working tree
      # checked out to run the composite action from. A consumer referencing
      # `tincke10/Jevest@main` does NOT need this step — see docs/ACTION.md
      # "Why no checkout": the Action reads everything (including
      # .jevest.yml, when it's not on disk) via the GitHub API instead.
      - uses: actions/checkout@v4

      - name: Run Jevest on itself
        uses: ./
        with:
          config-path: .jevest.yml
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on: never

name: "Jevest"
description: >-
  Automated PR review pipeline using Jev (TypeSafe AI) as a millisecond
  decision layer over an LLM reviewer: decides what to review, how much,
  and what to publish. Never merges (see docs/ACTION.md).
author: "tincke10"

branding:
  icon: "check-circle"
  color: "purple"

inputs:
  config-path:
    description: >-
      Path to the pipeline config file, relative to the consumer repo's
      root. Always fetched from the PR BASE sha via the API (a PR must not
      rewrite the rules that judge it), never from the checkout, unless
      config-from-checkout is true. No checkout step needed. See
      config/jevest.example.yml for the shape.
    required: false
    default: ".jevest.yml"
  config-from-checkout:
    description: >-
      "false" (default) or "true". When "true", config-path is read from the
      workspace first (falling back to the PR base sha). RISK: in agentic
      mode the workspace is a checkout of the PR HEAD, so a PR could rewrite
      its own provider, thresholds, budget and skip rules. Only for a
      workflow that checks out a trusted ref (never the PR head). See
      docs/ACTION.md "Config source".
    required: false
    default: "false"
  typesafe-api-key:
    description: "API key for TypeSafe AI (Jev). Pass as a secret, never a literal."
    required: true
  anthropic-api-key:
    description: >-
      API key for Anthropic. Required only when .jevest.yml selects the
      anthropic reviewer. Pass as a secret, never a literal.
    required: false
  openai-api-key:
    description: >-
      API key for OpenAI. Required only when .jevest.yml selects the
      openai reviewer. Pass as a secret, never a literal.
    required: false
  deepseek-api-key:
    description: >-
      API key for DeepSeek. Required only when .jevest.yml selects the
      deepseek reviewer. Pass as a secret, never a literal.
    required: false
  claude-code-oauth-token:
    description: >-
      Long-lived OAuth token from `claude setup-token` (Claude Pro/Max
      subscription). Required when reviewer.provider is claude-cli, which is
      the default since 1.0 (and the only provider for the default agentic
      mode); every review then draws on that subscription's quota. Pass a
      REPOSITORY secret of the consuming repo, never an organization secret
      or a literal.
    required: false
  claude-code-version:
    description: >-
      Version of @anthropic-ai/claude-code installed for the claude-cli
      provider (pinned, never "latest"). The agent's safety flags
      (--safe-mode, --restricted, --tools, the deny rules) were verified on
      the default version; change it only after checking them on the new one
      (see docs/ACTION.md "Claude Code CLI version").
    required: false
    default: "2.1.286"
  github-token:
    description: >-
      Token used to read the PR and publish comments/labels/checks. Needs
      `pull-requests: write` and `checks: write` (falls back to commit
      status if checks:write is absent). Usually the workflow's built-in
      GITHUB_TOKEN.
    required: true
  fail-on:
    description: >-
      "never" (default) or "failure". The `jevest` check always carries the
      review verdict regardless of this input; this only controls whether
      the workflow JOB itself exits non-zero when that conclusion is
      "failure" (a `fix` verdict, or a fail-closed run). Kept "never" by
      default so the check is the thing repo rules gate on.
    required: false
    default: "never"

outputs:
  check-conclusion:
    description: >-
      The `jevest` check conclusion, from the review verdict: "failure"
      (fix, or a fail-closed run), "neutral" (questions, unavailable) or
      "success" (clear). Not the merge gate's, which only decides the
      `jevest: auto-merge ok` label.
  verdict:
    description: >-
      The review verdict behind check-conclusion: "fix", "questions",
      "clear" or "unavailable". Same as the conclusion's verdict except on a
      fail-closed run (NFR-2), which is "unavailable" with a "failure"
      check. Empty when the run failed before publishing a review.
  findings-published:
    description: "Number of findings published (inline + summary), as a string."
  findings-low-confidence:
    description: >-
      Number of findings in stage 4's low-confidence bucket, as a string:
      findings that would have been filtered out but are kept visible
      (summary comment only, never inline, never affecting the merge gate)
      because `findingFilter.mode` is "annotate" (default) — H1 hasn't a
      valid verdict yet, see docs/ACTION.md "Finding filter mode". Always
      "0" in `mode: "discard"`.
  cost-usd:
    description: "Total LLM + Jev cost for this run, in USD, as a string."
  spend-usd:
    description: >-
      Cumulative spend counted against `spendCap` in .jevest.yml AFTER this
      run (current period), in USD, as a string; empty when the spend
      ledger issue could not be read or the run ended before the review
      stage. See docs/ACTION.md "Spend cap".
  jev-latency-p95-ms:
    description: >-
      H4: nearest-rank p95 of the latency of every Jev request in this run
      (triage, one per hunk, one per finding, merge gate), in ms, as a
      string; "0" when no Jev request answered. See docs/ACTION.md
      "Efficiency".
  jev-requests:
    description: "H4: number of Jev requests this run made, as a string."
  llm-tokens-saved-pct:
    description: >-
      H2: ESTIMATED share of LLM tokens the run saved by not reviewing the
      hunks Jev skipped, in percent (one decimal, may be negative), as a
      string. An estimate from the skipped hunks' diff size, not a
      measurement; see docs/BENCHMARK.md "H2 / H4 — measured per run".

runs:
  using: "composite"
  steps:
    # No prebuilt dist (unlike a typical `npm run build && actions/checkout`
    # JS action): this runs the TypeScript source directly with `tsx`, at the
    # cost of ~30-60s of setup per run (Node + pnpm + `pnpm install`) instead
    # of a single checked-in dist/index.js. A prebuilt dist can come later
    # once the pipeline stabilizes; until then this trades a few seconds of
    # CI time for zero risk of a stale bundle drifting from source.
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        # Pinned: pnpm/action-setup otherwise reads the CONSUMER repo's
        # package.json, which may not declare packageManager (or exist).
        version: 10.29.3
        package_json_file: ${{ github.action_path }}/package.json

    - name: Install Jevest's own dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --frozen-lockfile --prod=false

    - name: Install Claude Code CLI (claude-cli reviewer only)
      # Only when a subscription token is supplied: the claude-cli reviewer
      # shells out to `claude -p`, which is not on a runner by default.
      if: ${{ inputs.claude-code-oauth-token != '' }}
      shell: bash
      # Pinned (input claude-code-version): the agent's safety flags were
      # verified on that exact version, and a floating install could change
      # them under a running review.
      run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      env:
        CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}

    - name: Run Jevest
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm tsx src/action/main.ts
      env:
        # GITHUB_EVENT_PATH and GITHUB_OUTPUT are already provided by the
        # runner in every step's environment; no explicit mapping needed
        # (there is no `github.output` context — GITHUB_OUTPUT is env-only).
        INPUT_CONFIG_PATH: ${{ inputs.config-path }}
        INPUT_CONFIG_FROM_CHECKOUT: ${{ inputs.config-from-checkout }}
        INPUT_TYPESAFE_API_KEY: ${{ inputs.typesafe-api-key }}
        INPUT_ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        INPUT_OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        INPUT_DEEPSEEK_API_KEY: ${{ inputs.deepseek-api-key }}
        INPUT_CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}

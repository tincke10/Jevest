# Jevest pipeline config (SPEC §5 Fase 2). This file IS the single source
# of built-in defaults (see src/adapters/config/jevest-config.ts). See
# docs/SPEC.md for the six-stage pipeline this drives.
#
# `.jevest.yml` at your repo root is a PARTIAL OVERRIDE of this file, not a
# copy of it: only write the keys you actually want to change. Anything
# you omit falls back to the value shown here, deep-merged key by key (so
# e.g. overriding thresholds.triage.low leaves thresholds.triage.medium
# and every other stage untouched). Arrays and plain values (budgetUsd,
# skipChangeKinds, etc.) are replaced wholesale, never merged. An unknown
# top-level key throws immediately, naming the key — it's almost always a
# typo, since a partial file having most keys absent is the normal case.
# A missing or empty `.jevest.yml` is equivalent to this entire file.
#
# The LLM that writes the actual review (FR-4). Jev never writes text.
# Set provider: none for Jev-only mode: the review stage never runs (no
# LLM key needed at all), finding-filter and inline comments stay empty,
# and the merge gate still runs on triage + CI status. Useful to validate
# triage/merge-gate behavior on a new repo before spending on LLM reviews.
reviewer:
  provider: anthropic # or: openai, deepseek, claude-cli, none
  model: claude-sonnet-5 # ignored (and optional) when provider is none
  # deepseek: model deepseek-v4-pro (default quality) or deepseek-flash
  # (cheapest). Needs the DEEPSEEK_API_KEY secret / deepseek-api-key input.
  # claude-cli: bills a Claude Pro/Max subscription via `claude -p`; needs
  # the CLAUDE_CODE_OAUTH_TOKEN secret / claude-code-oauth-token input
  # (generate it with `claude setup-token`). See docs/ACTION.md.

# Confidence bands per pipeline stage and risk level (NFR-13):
# auto_min/confirm_min per stage per risk level.
# confidence >= auto_min    -> act automatically
# confidence >= confirm_min -> ask for human confirmation
# confidence <  confirm_min -> escalate to a human
thresholds:
  triage:
    none: { auto_min: 0.85, confirm_min: 0.55 }
    low: { auto_min: 0.90, confirm_min: 0.60 }
    medium: { auto_min: 0.95, confirm_min: 0.70 }
    high: { auto_min: 0.98, confirm_min: 0.80 }
    critical: { auto_min: 0.99, confirm_min: 0.90 }
  hunk_profile:
    none: { auto_min: 0.80, confirm_min: 0.50 }
    low: { auto_min: 0.85, confirm_min: 0.55 }
    medium: { auto_min: 0.90, confirm_min: 0.65 }
    high: { auto_min: 0.95, confirm_min: 0.75 }
    critical: { auto_min: 0.97, confirm_min: 0.85 }
  finding_filter:
    none: { auto_min: 0.85, confirm_min: 0.55 }
    low: { auto_min: 0.90, confirm_min: 0.60 }
    medium: { auto_min: 0.93, confirm_min: 0.68 }
    high: { auto_min: 0.96, confirm_min: 0.78 }
    critical: { auto_min: 0.99, confirm_min: 0.90 }
  merge_gate:
    none: { auto_min: 0.90, confirm_min: 0.65 }
    low: { auto_min: 0.95, confirm_min: 0.70 }
    medium: { auto_min: 0.97, confirm_min: 0.80 }
    high: { auto_min: 0.99, confirm_min: 0.90 }
    critical: { auto_min: 0.999, confirm_min: 0.95 }

# Size classification thresholds (NFR-5: counts are resolved in code, never
# asked to Jev as numbers). changedLines = additions + deletions.
# Defaults shown below apply when this key is omitted entirely.
sizeThresholds:
  smallMaxChangedLines: 50
  mediumMaxChangedLines: 300

# Max USD spend per PR run (NFR-10). The LLM reviewer is the real cost;
# Jev is $0.042/MTok input, negligible in comparison.
budgetUsd: 5

# Cumulative cap over the WHOLE service (NFR-10, second half), on top of
# the per-run budgetUsd above. The running total lives in one "Jevest
# spend ledger" issue in your repo (see docs/ACTION.md "Spend cap"). Once
# the total reaches `usd`, the LLM review stage is skipped (Jev-only run)
# until the period rolls over or you edit/close the ledger issue; from
# `warnAtUsd` on, every run carries a warning. This is what protects a
# personal Claude subscription when reviewer.provider is claude-cli.
# Always present: to run without a cap, set `usd` to a very high number.
spendCap:
  usd: 50 # hard stop; warnAtUsd must be below it
  period: month # "month" = calendar month in UTC, resets automatically; "total" = never resets
  warnAtUsd: 40

# Hard cap on hunks profiled/reviewed per PR (FR-3.4 says one Jev request
# per hunk, so this also bounds request count).
maxHunks: 50

# change_kind values that skip the LLM reviewer when Jev's confidence is
# in the "auto" band (FR-3.3). Provisional per SPEC §4.3: only
# rename-or-format is safe to skip until H0' has more support.
skipChangeKinds:
  - rename-or-format

# NFR-2: if Jev doesn't respond (timeout/5xx after retries), always fail
# closed — triage assumes high risk, the filter publishes nothing inline,
# merge gate goes red. Never set this to false outside a controlled
# experiment.
failClosed: true

# Triage v2 (H7 adopted, see docs/BENCHMARK.md): the description is judged
# against what the change actually does, and product areas raise risk.
triage:
  # Product context file in YOUR repo (see config/context.example.yml and
  # docs/ACTION.md "Product context"). Always read from the PR's BASE
  # commit, never from the PR head, so a PR cannot rewrite the rules that
  # judge it. Missing file = no product context (still works, no error).
  productContextPath: .jevest/context.yml
  # Change summary: one extra LLM call per PR, written from the diff alone
  # (it never sees the title or description), so Jev can compare the
  # author's story with what the code does. H7: with it, description
  # mismatch detection reaches recall 0.99 / precision 1.00; without it
  # the result is only partial.
  #   auto   - summarize when reviewer.provider is not "none" and the spend
  #            cap is not reached (the summary is billed like a review call).
  #   always - a summary is mandatory: reviewer.provider must be an LLM;
  #            runs even when the spend cap turned this into a Jev-only run.
  #   never  - no summary; the description is judged against file facts
  #            only (H7 without-summary arm).
  changeSummary: auto

# Stage 4 (finding filter) mode. H1 (see docs/BENCHMARK.md, docs/SPEC.md
# §4.6) found Jev's is_real_defect judgment near chance against the current
# labels, so the label isn't trustworthy enough to discard findings on yet.
findingFilter:
  # annotate (default) - nothing is ever discarded. A finding that would
  #   have been filtered out is kept in a separate "low-confidence" bucket
  #   instead, shown in the summary comment under a collapsed section —
  #   never as an inline comment, never affecting the merge gate — so
  #   nothing is silently dropped while H1 is pending a valid verdict.
  # discard - the original behavior: low-confidence findings are dropped.
  #   Opt in only once H1 has a valid verdict for your data.
  mode: annotate
  # Post-hoc calibration of is_real_defect (H3, see docs/SPEC.md §4.6.3 and
  # docs/BENCHMARK.md "Post-hoc calibration study"). Jev's raw probability
  # runs well above the rate at which its findings are really defects
  # (ECE 0.284 on the H1b set at a 26.3% base rate), so the number that
  # reaches the thresholds above does not mean what it says.
  #   none (default) - the identity. Nothing is applied; the behavior is
  #     exactly what every committed benchmark measured.
  #   file - read a calibration map from `calibrationPath` and apply it to
  #     is_real_defect BEFORE the band and the predicted-real cut. The raw
  #     probability is kept alongside it, and the summary comment shows both.
  # The default stays "none" because the study's cross-set verdict is FAIL: a
  # map fitted on one repo's findings carried an ECE of 0.216 to another
  # distribution. Fit your own on your own labeled findings (`pnpm calibrate`)
  # before turning this on; config/calibration/is_real_defect.json is Jevest's,
  # published as a starting point, not as a default.
  calibration: none
  # Read from the PR's BASE commit, exactly like triage.productContextPath: a
  # PR must not be able to rewrite the map that decides which of its findings
  # get published. Missing file = an error only when calibration is "file".
  calibrationPath: .jevest/calibration.json

# FR-7 publish behavior.
publish:
  # RECOMMENDATION: set this to false for the first weeks of a rollout on a
  # new repo. Auto-band findings still get evaluated and counted — they
  # just appear in the summary comment under "Findings (high confidence)"
  # instead of as inline PR comments, so a team new to the tool can watch
  # its accuracy before it starts leaving comments on people's code.
  inlineComments: true

# Confidence bands per pipeline stage and risk level (SPEC NFR-13).
#
# Risk levels are the five levels from the triage `risk` score (SPEC FR-2.2)
# and propagate as context into every later stage, so a PR classified as
# high-risk at triage needs higher confidence to auto-act at every stage.
#
# auto_min:    confidence >= auto_min    -> act automatically
# confirm_min: confidence >= confirm_min -> ask for human confirmation
#              confidence <  confirm_min -> escalate to a human
#
# These are example thresholds for the spike/fase 1 skeleton, not tuned
# values; adjust once the H0/H3 evaluation harness produces real numbers.

triage:
  none:
    auto_min: 0.85
    confirm_min: 0.55
  low:
    auto_min: 0.90
    confirm_min: 0.60
  medium:
    auto_min: 0.95
    confirm_min: 0.70
  high:
    auto_min: 0.98
    confirm_min: 0.80
  critical:
    auto_min: 0.99
    confirm_min: 0.90

hunk_select:
  none:
    auto_min: 0.80
    confirm_min: 0.50
  low:
    auto_min: 0.85
    confirm_min: 0.55
  medium:
    auto_min: 0.90
    confirm_min: 0.65
  high:
    auto_min: 0.95
    confirm_min: 0.75
  critical:
    auto_min: 0.97
    confirm_min: 0.85

finding_filter:
  none:
    auto_min: 0.85
    confirm_min: 0.55
  low:
    auto_min: 0.90
    confirm_min: 0.60
  medium:
    auto_min: 0.93
    confirm_min: 0.68
  high:
    auto_min: 0.96
    confirm_min: 0.78
  critical:
    auto_min: 0.99
    confirm_min: 0.90

merge_gate:
  none:
    auto_min: 0.90
    confirm_min: 0.65
  low:
    auto_min: 0.95
    confirm_min: 0.70
  medium:
    auto_min: 0.97
    confirm_min: 0.80
  high:
    auto_min: 0.99
    confirm_min: 0.90
  critical:
    auto_min: 0.999
    confirm_min: 0.95

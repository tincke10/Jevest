<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <defs>
    <clipPath id="win"><rect x="0" y="0" width="820" height="440" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#win)">
    <rect width="820" height="440" fill="#0d1117"/>
    <rect width="820" height="36" fill="#161b22"/>
    <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="18" r="6" fill="#27c93f"/>
    <text x="410" y="23" text-anchor="middle" fill="#8b949e" font-size="12">jevest · InvisibleGeeks/prolicht · PR #472 · Jev-only run (reviewer: none)</text>
  </g>
  <rect x="0.5" y="0.5" width="819" height="439" rx="12" fill="none" stroke="#30363d"/>

  <g fill="#c9d1d9">
    <text x="20" y="66"><tspan fill="#58a6ff">$</tspan> pnpm action
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.02;0.021" dur="14s" repeatCount="indefinite" fill="freeze"/>
    </text>

